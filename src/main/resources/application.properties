spring.application.name=task-planner

# ===============================
# SERVER
# ===============================
server.port=8080

# ===============================
# DATABASE
# ===============================
# File-based H2 is deliberately used instead of an in-memory
# database because assessment requirements state that tasks
# must survive application restarts.
spring.datasource.url=jdbc:h2:file:./data/taskplanner
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# H2 CONSOLE
# ===============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================
# TIMEZONE
# ===============================
# Business timezone used when determining whether a task is overdue.
spring.jackson.time-zone=Africa/Harare